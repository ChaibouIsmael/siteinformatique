<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Tech Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <!-- En-tête / Navigation -->
    <header>
        <div class="logo">TechStore</div>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="catalogue.html">Catalogue</a></li>
                <li><a href="apropos.html">À propos</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="produit.html">Produit</a></li>

            </ul>
        </nav>
    </header>
    <!-- Contenu principal -->
    <main class="container">
        <h2>Contactez-nous</h2>
        <p>Une question sur un produit ou une commande ? N'hésitez pas à nous envoyer un message.</p>

        <div class="contact-wrapper">
            <!-- Formulaire de contact -->
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Nom complet :</label>
                    <input type="text" id="name" name="name" placeholder="Votre nom" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresse E-mail :</label>
                    <input type="email" id="email" name="email" placeholder="votre.email@exemple.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Sujet :</label>
                    <input type="text" id="subject" name="subject" placeholder="Sujet de votre message">
                </div>

                <div class="form-group">
                    <label for="message">Message :</label>
                    <textarea id="message" name="message" rows="5" placeholder="Écrivez votre message ici..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Envoyer le message</button>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 TechStore - Tous droits réservés.</p>
        <div class="reseau">
                <span class="r1">
                    <i class="fa-brands fa-square-facebook"></i>
                    <i class="fa-brands fa-whatsapp"></i>
                    <i class="fa-brands fa-instagram"></i>
                    <i class="fa-brands fa-twitter"></i>
                    <i class="fa-brands fa-square-x-twitter"></i>
                </span>
            </div>
    </footer>


</body>
</html>
